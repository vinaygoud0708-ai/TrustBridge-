name: CI — Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npx next build
        env:
          # Use mock values for build-time checks
          DATABASE_URL: "file:./prisma/dev.db"
          NEXTAUTH_SECRET: "ci-build-secret-do-not-use-in-prod"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_mock"
          NEXT_PUBLIC_PUSHER_KEY: "mock"
          NEXT_PUBLIC_PUSHER_CLUSTER: "mock"
          STRIPE_SECRET_KEY: "sk_test_mock"
          STRIPE_PUBLISHABLE_KEY: "pk_test_mock"
          STRIPE_WEBHOOK_SECRET: "whsec_mock"
          CLOUDINARY_CLOUD_NAME: "mock"
          CLOUDINARY_API_KEY: "mock"
          CLOUDINARY_API_SECRET: "mock"
          RESEND_API_KEY: "re_mock"
          PUSHER_APP_ID: "mock"
          PUSHER_KEY: "mock"
          PUSHER_SECRET: "mock"
          PUSHER_CLUSTER: "mock"
